<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App - Dyana Shaffiqah</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0c1b; /* Latar belakang gelap bernuansa ungu malam */
            color: #f3e8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .todo-container {
            background: #1e1b2e; /* Kad latar belakang ungu gelap */
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
            width: 350px;
            border: 1px solid #3b0764;
        }
        h2 {
            text-align: center;
            color: #c084fc; /* Tajuk warna ungu cerah */
            margin-bottom: 1.5rem;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #6b21a8;
            background: #0f0c1b;
            color: #fff;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #c084fc;
        }
        button {
            padding: 10px 15px;
            background-color: #9333ea; /* Butang warna ungu utama */
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #7e22ce;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #2e1065; /* Senarai tugasan warna ungu lembut */
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #581c87;
        }
        li.completed span {
            text-decoration: line-through;
            color: #a855f7;
            opacity: 0.7;
        }
        .delete-btn {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #b91c1c;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #c084fc;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h2>To-Do List</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">Add</button>
        </div>
        <ul id="taskList"></ul>
        <a href="index.html" class="back-link">&larr; Back to Portfolio</a>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const taskList = document.getElementById('taskList');

        addTaskBtn.addEventListener('click', function() {
            const taskText = taskInput.value.trim();
            if (taskText === "") return;

            const li = document.createElement('li');
            
            const span = document.createElement('span');
            span.textContent = taskText;
            span.style.cursor = 'pointer';
            
            span.addEventListener('click', function() {
                li.classList.toggle('completed');
            });

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'Delete';
            deleteBtn.className = 'delete-btn';
            deleteBtn.addEventListener('click', function() {
                taskList.removeChild(li);
            });

            li.appendChild(span);
            li.appendChild(deleteBtn);
            taskList.appendChild(li);

            taskInput.value = "";
        });

        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTaskBtn.click();
            }
        });
    </script>

</body>
</html>
