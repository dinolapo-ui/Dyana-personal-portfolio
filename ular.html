<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game (C++ Style) - Dyana Shaffiqah</title>
    <style>
        body {
            /* Gaya latar belakang ala terminal konsol C++ (Hitam legap) */
            font-family: 'Courier New', Courier, monospace;
            background-color: #0c0c0c;
            color: #00ff00; /* Teks hijau gaya terminal lama */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 {
            margin-bottom: 5px;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .console-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        canvas {
            /* Bingkai ala terminal kod */
            border: 2px solid #334155;
            background-color: #000000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
        }
        .score-board {
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .back-link {
            margin-top: 1.5rem;
            color: #c084fc;
            text-decoration: none;
            font-family: Arial, sans-serif;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h2>// SNAKE_GAME.cpp</h2>
    <div class="console-subtitle">Running on Web Browser (C++ Logic Simulated)</div>
    
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    
    <div class="score-board">Score: <span id="scoreVal">0</span></div>
    <p style="font-size: 0.9rem; color: #64748b; margin-top: 5px;">Use Arrow Keys to control the snake</p>

    <a href="index.html" class="back-link">&larr; Back to Portfolio</a>

    <script>
        const canvas = document.getElementById("snakeCanvas");
        const ctx = canvas.getContext("2d");
        const scoreVal = document.getElementById("scoreVal");

        const gridSize = 20;
        const tileSize = 20;
        let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        let food = {x: 5, y: 5};
        let dx = 0;
        let dy = -1;
        let score = 0;

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (event.key === "ArrowUp" && dy === 0) { dx = 0; dy = -1; }
            if (event.key === "ArrowDown" && dy === 0) { dx = 0; dy = 1; }
            if (event.key === "ArrowLeft" && dx === 0) { dx = -1; dy = 0; }
            if (event.key === "ArrowRight" && dx === 0) { dx = 1; dy = 0; }
        }

        function main() {
            if (isGameOver()) {
                alert("GAME OVER! Final Score: " + score);
                location.reload();
                return;
            }

            setTimeout(() => {
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                main();
            }, 100);
        }

        function clearCanvas() {
            // Latar belakang hitam pekat seperti tetingkap terminal hitam
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            // Badan ular warna hijau terang (mengikut gaya Raylib DARKGREEN / Terminal)
            ctx.fillStyle = "#22c55e";
            snake.forEach(part => {
                ctx.fillRect(part.x * tileSize, part.y * tileSize, tileSize - 2, tileSize - 2);
            });
        }

        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreVal.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * gridSize);
            food.y = Math.floor(Math.random() * gridSize);
        }

        function drawFood() {
            // Makanan warna merah (sama seperti kod C++ Raylib anda)
            ctx.fillStyle = "#ef4444";
            ctx.fillRect(food.x * tileSize, food.y * tileSize, tileSize - 2, tileSize - 2);
        }

        function isGameOver() {
            const head = snake[0];
            if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) return true;
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) return true;
            }
            return false;
        }

        generateFood();
        main();
    </script>
</body>
</html>
